<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 64" width="860" height="64">
  <defs>
    <linearGradient id="statusBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#13171F"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="statusBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="15%" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="85%" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <filter id="statusGlow" x="-15%" y="-50%" width="130%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif; }
    .label { fill: #64748B; font-size: 8.5px; font-weight: 600; letter-spacing: 1.8px; }
    .value { fill: #F1F5F9; font-size: 11px; font-weight: 600; letter-spacing: 0.3px; }
    .divider-line { stroke: #8B5CF6; stroke-opacity: 0.12; }
  </style>

  <!-- Background card -->
  <rect x="0" y="0" width="860" height="64" rx="12" fill="url(#statusBg)"/>
  <rect x="0" y="0" width="860" height="64" rx="12" fill="none" stroke="url(#statusBorder)" stroke-width="1"/>
  <!-- Top accent line -->
  <line x1="0" y1="1" x2="860" y2="1" stroke="url(#accentLine)"/>

  <!-- System Status -->
  <g transform="translate(36, 22)">
    <text class="label" y="0">SYSTEM STATUS</text>
    <g transform="translate(0, 16)">
      <circle cx="0" cy="-3" r="3.5" fill="#10B981" filter="url(#statusGlow)">
        <animate attributeName="opacity" values="0.55;1;0.55" dur="2.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      </circle>
      <text class="value" x="12" y="0" fill="#10B981">OPERATIONAL</text>
    </g>
  </g>

  <!-- Divider 1 -->
  <line x1="198" y1="14" x2="198" y2="50" class="divider-line"/>

  <!-- Threat Level -->
  <g transform="translate(222, 22)">
    <text class="label" y="0">THREAT LEVEL</text>
    <g transform="translate(0, 16)">
      <circle cx="0" cy="-3" r="3.5" fill="#3B82F6" filter="url(#statusGlow)">
        <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      </circle>
      <text class="value" x="12" y="0" fill="#3B82F6">NOMINAL</text>
    </g>
  </g>

  <!-- Divider 2 -->
  <line x1="378" y1="14" x2="378" y2="50" class="divider-line"/>

  <!-- Core Role -->
  <g transform="translate(402, 22)">
    <text class="label" y="0">CORE ROLE</text>
    <g transform="translate(0, 16)">
      <circle cx="0" cy="-3" r="3.5" fill="#8B5CF6" filter="url(#statusGlow)">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="3.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      </circle>
      <text class="value" x="12" y="0">SOC ANALYST &amp; AUTOMATION ENGINEER</text>
    </g>
  </g>

  <!-- Divider 3 -->
  <line x1="638" y1="14" x2="638" y2="50" class="divider-line"/>

  <!-- Uptime -->
  <g transform="translate(662, 22)">
    <text class="label" y="0">UPTIME</text>
    <g transform="translate(0, 16)">
      <circle cx="0" cy="-3" r="3.5" fill="#F59E0B" filter="url(#statusGlow)">
        <animate attributeName="opacity" values="0.55;1;0.55" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      </circle>
      <text class="value" x="12" y="0" fill="#F59E0B">24 × 7 × 365</text>
    </g>
  </g>

  <!-- Subtle scanning accent (extremely slow) -->
  <rect x="-60" y="0" width="60" height="64" rx="12" fill="url(#accentLine)" opacity="0.3">
    <animateTransform attributeName="transform" type="translate" values="0,0;920,0" dur="12s" repeatCount="indefinite"/>
  </rect>
</svg>
