<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 40" width="800" height="40">
  <defs>
    <linearGradient id="divLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0"/>
      <stop offset="30%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </linearGradient>
    <filter id="divGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Main line -->
  <line x1="60" y1="20" x2="740" y2="20" stroke="url(#divLine)" stroke-width="1"/>
  <!-- Center diamond -->
  <g transform="translate(400, 20)" filter="url(#divGlow)">
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#8B5CF6" opacity="0.9">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,-3 3,0 0,3 -3,0" fill="#A78BFA" opacity="0.6"/>
  </g>
  <!-- Side dots -->
  <circle cx="200" cy="20" r="1.5" fill="#8B5CF6" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="20" r="1.5" fill="#8B5CF6" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite" begin="2s"/>
  </circle>
</svg>
