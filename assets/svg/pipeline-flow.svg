<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#13171F"/>
    </linearGradient>
    <linearGradient id="flowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C2333"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pSoftGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .node-title { fill: #F1F5F9; font-size: 10px; font-weight: 600; text-anchor: middle; }
    .node-sub { fill: #64748B; font-size: 8px; font-weight: 400; text-anchor: middle; }
    .node-icon { fill: #8B5CF6; font-size: 18px; text-anchor: middle; }
  </style>

  <!-- ===== NODE 1: SIEM Alert ===== -->
  <g transform="translate(70, 110)">
    <rect x="-55" y="-40" width="110" height="80" rx="10" fill="url(#nodeGrad)" stroke="#8B5CF6" stroke-width="0.8" stroke-opacity="0.3"/>
    <text class="node-icon" y="-8">🚨</text>
    <text class="node-title" y="10">SIEM ALERT</text>
    <text class="node-sub" y="24">Splunk / Wazuh</text>
    <!-- Pulse ring -->
    <circle r="45" fill="none" stroke="#EF4444" stroke-width="1" opacity="0">
      <animate attributeName="r" values="40;55" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Connection 1→2 -->
  <line x1="125" y1="110" x2="205" y2="110" stroke="url(#flowLine)" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="1.5s" repeatCount="indefinite"/>
  </line>
  <polygon points="200,105 210,110 200,115" fill="#8B5CF6" opacity="0.6"/>

  <!-- ===== NODE 2: Parser Script ===== -->
  <g transform="translate(270, 110)">
    <rect x="-55" y="-40" width="110" height="80" rx="10" fill="url(#nodeGrad)" stroke="#8B5CF6" stroke-width="0.8" stroke-opacity="0.3"/>
    <text class="node-icon" y="-8">🐍</text>
    <text class="node-title" y="10">PARSER</text>
    <text class="node-sub" y="24">Python / Bash</text>
  </g>

  <!-- Connection 2→3 (splits into two paths) -->
  <!-- Upper path (to Threat Intel) -->
  <path d="M325,100 Q370,60 405,60" fill="none" stroke="url(#flowLine)" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <polygon points="400,55 410,60 400,65" fill="#8B5CF6" opacity="0.6"/>

  <!-- Lower path (to Notification) -->
  <path d="M325,120 Q370,160 405,160" fill="none" stroke="url(#flowLine)" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
  </path>
  <polygon points="400,155 410,160 400,165" fill="#8B5CF6" opacity="0.6"/>

  <!-- ===== NODE 3A: Threat Intel (upper) ===== -->
  <g transform="translate(470, 60)">
    <rect x="-55" y="-35" width="110" height="70" rx="10" fill="url(#nodeGrad)" stroke="#F59E0B" stroke-width="0.8" stroke-opacity="0.3"/>
    <text class="node-icon" y="-6">🔍</text>
    <text class="node-title" y="10">THREAT INTEL</text>
    <text class="node-sub" y="22">VT / AbuseIPDB</text>
  </g>

  <!-- ===== NODE 3B: Notify (lower) ===== -->
  <g transform="translate(470, 160)">
    <rect x="-55" y="-35" width="110" height="70" rx="10" fill="url(#nodeGrad)" stroke="#3B82F6" stroke-width="0.8" stroke-opacity="0.3"/>
    <text class="node-icon" y="-6">📨</text>
    <text class="node-title" y="10">NOTIFY</text>
    <text class="node-sub" y="22">Slack / Teams</text>
  </g>

  <!-- Connection 3A→4 -->
  <line x1="525" y1="60" x2="605" y2="60" stroke="url(#flowLine)" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="20;0" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
  </line>
  <polygon points="600,55 610,60 600,65" fill="#8B5CF6" opacity="0.6"/>

  <!-- ===== NODE 4: Auto-Remediate ===== -->
  <g transform="translate(670, 60)">
    <rect x="-55" y="-35" width="110" height="70" rx="10" fill="url(#nodeGrad)" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.3"/>
    <text class="node-icon" y="-6">🛡️</text>
    <text class="node-title" y="10">REMEDIATE</text>
    <text class="node-sub" y="22">Block / Isolate</text>
    <!-- Success pulse -->
    <circle r="40" fill="none" stroke="#10B981" stroke-width="1" opacity="0">
      <animate attributeName="r" values="35;50" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Flow particles along main path -->
  <circle r="2.5" fill="#A78BFA" filter="url(#pSoftGlow)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M70,110 L270,110 Q330,60 470,60 L670,60"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#A78BFA" filter="url(#pSoftGlow)">
    <animateMotion dur="4s" repeatCount="indefinite" begin="1.5s" path="M70,110 L270,110 Q330,160 470,160"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="4s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  <circle r="2.5" fill="#F59E0B" filter="url(#pSoftGlow)">
    <animateMotion dur="4s" repeatCount="indefinite" begin="2.5s" path="M70,110 L270,110 Q330,60 470,60 L670,60"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite" begin="2.5s"/>
  </circle>
</svg>
