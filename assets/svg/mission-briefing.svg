<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160">
  <defs>
    <linearGradient id="mbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0F1318"/>
    </linearGradient>
    <linearGradient id="mbBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="mbAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="20%" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#A78BFA" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <filter id="mbGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mb-label { fill: #64748B; font-size: 8px; font-weight: 600; letter-spacing: 2px; }
    .mb-title { fill: #F1F5F9; font-size: 14px; font-weight: 700; }
    .mb-body { fill: #94A3B8; font-size: 11px; font-weight: 400; line-height: 1.5; }
    .mb-tag { fill: #8B5CF6; font-size: 8.5px; font-weight: 600; letter-spacing: 0.5px; }
    .mb-highlight { fill: #F59E0B; font-size: 11px; font-weight: 600; }
  </style>

  <!-- Card background -->
  <rect x="0" y="0" width="520" height="160" rx="12" fill="url(#mbBg)" stroke="url(#mbBorder)" stroke-width="1"/>

  <!-- Left accent bar -->
  <rect x="0" y="16" width="3" height="128" rx="1.5" fill="url(#mbAccent)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </rect>

  <!-- Header -->
  <text x="24" y="30" class="mb-label">CURRENT MISSION BRIEFING</text>
  <circle cx="504" cy="24" r="4" fill="#10B981" filter="url(#mbGlow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="470" y="28" class="mb-label" fill="#10B981">ACTIVE</text>

  <!-- Divider line -->
  <line x1="24" y1="40" x2="496" y2="40" stroke="#8B5CF6" stroke-width="0.4" stroke-opacity="0.12"/>

  <!-- Mission content -->
  <text x="24" y="62" class="mb-title">Reduce MTTR Through Intelligent Automation</text>

  <text x="24" y="82" class="mb-body">Building automated pipelines that transform raw SIEM alerts into</text>
  <text x="24" y="96" class="mb-body">actionable intelligence — parsing, enriching, and remediating threats</text>
  <text x="24" y="110" class="mb-body">before they escalate. Every manual step is a script waiting to be written.</text>

  <!-- Focus tags -->
  <g transform="translate(24, 130)">
    <rect x="0" y="0" width="88" height="20" rx="4" fill="#8B5CF6" fill-opacity="0.08" stroke="#8B5CF6" stroke-width="0.5" stroke-opacity="0.2"/>
    <text x="44" y="13.5" class="mb-tag" text-anchor="middle">DETECTION</text>

    <rect x="96" y="0" width="88" height="20" rx="4" fill="#8B5CF6" fill-opacity="0.08" stroke="#8B5CF6" stroke-width="0.5" stroke-opacity="0.2"/>
    <text x="140" y="13.5" class="mb-tag" text-anchor="middle">AUTOMATION</text>

    <rect x="192" y="0" width="88" height="20" rx="4" fill="#8B5CF6" fill-opacity="0.08" stroke="#8B5CF6" stroke-width="0.5" stroke-opacity="0.2"/>
    <text x="236" y="13.5" class="mb-tag" text-anchor="middle">THREAT INTEL</text>

    <rect x="288" y="0" width="88" height="20" rx="4" fill="#F59E0B" fill-opacity="0.06" stroke="#F59E0B" stroke-width="0.5" stroke-opacity="0.2"/>
    <text x="332" y="13.5" class="mb-tag" text-anchor="middle" fill="#F59E0B">OPEN SOURCE</text>
  </g>
</svg>
