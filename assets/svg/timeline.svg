<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400">
  <defs>
    <linearGradient id="tlLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.05"/>
      <stop offset="15%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="85%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="tlCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#13171F"/>
    </linearGradient>
    <filter id="tlGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .tl-year { fill: #F59E0B; font-size: 11px; font-weight: 700; }
    .tl-title { fill: #F1F5F9; font-size: 12px; font-weight: 600; }
    .tl-desc { fill: #94A3B8; font-size: 10px; font-weight: 400; }
    .tl-tag { fill: #8B5CF6; font-size: 8px; font-weight: 600; letter-spacing: 1px; }
  </style>

  <!-- Central timeline spine -->
  <line x1="350" y1="20" x2="350" y2="380" stroke="url(#tlLine)" stroke-width="2"/>

  <!-- ===== Milestone 1 (LEFT) — Foundation ===== -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze" begin="0.3s"/>
    <!-- Card -->
    <rect x="60" y="30" width="250" height="65" rx="8" fill="url(#tlCardBg)" stroke="#8B5CF6" stroke-width="0.5" stroke-opacity="0.2"/>
    <!-- Connector -->
    <line x1="310" y1="62" x2="342" y2="62" stroke="#8B5CF6" stroke-width="0.8" opacity="0.3"/>
    <!-- Dot -->
    <circle cx="350" cy="62" r="6" fill="#0D1117" stroke="#8B5CF6" stroke-width="1.5"/>
    <circle cx="350" cy="62" r="2.5" fill="#8B5CF6" filter="url(#tlGlow)"/>
    <!-- Content -->
    <text x="80" y="50" class="tl-year">2022</text>
    <text x="120" y="50" class="tl-title">Security Foundations</text>
    <text x="80" y="66" class="tl-desc">Started cybersecurity journey — Linux, networking,</text>
    <text x="80" y="80" class="tl-desc">threat analysis fundamentals</text>
  </g>

  <!-- ===== Milestone 2 (RIGHT) — SOC Operations ===== -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze" begin="0.7s"/>
    <rect x="390" y="110" width="250" height="65" rx="8" fill="url(#tlCardBg)" stroke="#8B5CF6" stroke-width="0.5" stroke-opacity="0.2"/>
    <line x1="358" y1="142" x2="390" y2="142" stroke="#8B5CF6" stroke-width="0.8" opacity="0.3"/>
    <circle cx="350" cy="142" r="6" fill="#0D1117" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="350" cy="142" r="2.5" fill="#F59E0B" filter="url(#tlGlow)"/>
    <text x="410" y="130" class="tl-year">2023</text>
    <text x="450" y="130" class="tl-title">SOC Operations</text>
    <text x="410" y="146" class="tl-desc">SIEM deployment — Splunk, Wazuh, FortiGate.</text>
    <text x="410" y="160" class="tl-desc">Incident response &amp; log correlation</text>
  </g>

  <!-- ===== Milestone 3 (LEFT) — Automation ===== -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze" begin="1.1s"/>
    <rect x="60" y="190" width="250" height="65" rx="8" fill="url(#tlCardBg)" stroke="#8B5CF6" stroke-width="0.5" stroke-opacity="0.2"/>
    <line x1="310" y1="222" x2="342" y2="222" stroke="#8B5CF6" stroke-width="0.8" opacity="0.3"/>
    <circle cx="350" cy="222" r="6" fill="#0D1117" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="350" cy="222" r="2.5" fill="#10B981" filter="url(#tlGlow)"/>
    <text x="80" y="210" class="tl-year">2024</text>
    <text x="120" y="210" class="tl-title">SecOps Automation</text>
    <text x="80" y="226" class="tl-desc">Python &amp; PowerShell automation pipelines.</text>
    <text x="80" y="240" class="tl-desc">Auto-remediation &amp; threat intel enrichment</text>
  </g>

  <!-- ===== Milestone 4 (RIGHT) — Advanced ===== -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze" begin="1.5s"/>
    <rect x="390" y="270" width="250" height="65" rx="8" fill="url(#tlCardBg)" stroke="#8B5CF6" stroke-width="0.5" stroke-opacity="0.2"/>
    <line x1="358" y1="302" x2="390" y2="302" stroke="#8B5CF6" stroke-width="0.8" opacity="0.3"/>
    <circle cx="350" cy="302" r="6" fill="#0D1117" stroke="#8B5CF6" stroke-width="1.5"/>
    <circle cx="350" cy="302" r="2.5" fill="#8B5CF6" filter="url(#tlGlow)"/>
    <text x="410" y="290" class="tl-year">2025</text>
    <text x="450" y="290" class="tl-title">Detection Engineering</text>
    <text x="410" y="306" class="tl-desc">Custom detection rules, MITRE ATT&amp;CK mapping,</text>
    <text x="410" y="320" class="tl-desc">advanced threat hunting &amp; cloud security</text>
  </g>

  <!-- ===== Current (LEFT) — Now ===== -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze" begin="1.9s"/>
    <rect x="60" y="345" width="250" height="45" rx="8" fill="url(#tlCardBg)" stroke="#F59E0B" stroke-width="0.8" stroke-opacity="0.4"/>
    <line x1="310" y1="367" x2="342" y2="367" stroke="#F59E0B" stroke-width="0.8" opacity="0.4"/>
    <circle cx="350" cy="367" r="7" fill="#0D1117" stroke="#F59E0B" stroke-width="2">
      <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="367" r="3" fill="#F59E0B" filter="url(#tlGlow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="80" y="365" class="tl-year">NOW</text>
    <text x="115" y="365" class="tl-title">Building the Future</text>
    <text x="80" y="380" class="tl-desc">Open source security tooling &amp; community</text>
  </g>
</svg>
