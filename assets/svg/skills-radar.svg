<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" width="460" height="460">
  <defs>
    <linearGradient id="radarFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="rGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rSoftGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .radar-label { fill: #CBD5E1; font-size: 11px; font-weight: 600; text-anchor: middle; }
    .radar-score { fill: #8B5CF6; font-size: 9px; font-weight: 500; text-anchor: middle; }
    .ring { fill: none; stroke: #8B5CF6; }
  </style>

  <!-- Background grid rings -->
  <g transform="translate(230, 230)">
    <!-- Concentric rings (20%, 40%, 60%, 80%, 100%) -->
    <circle r="180" class="ring" stroke-opacity="0.06" stroke-width="1"/>
    <circle r="144" class="ring" stroke-opacity="0.08" stroke-width="0.8"/>
    <circle r="108" class="ring" stroke-opacity="0.10" stroke-width="0.6"/>
    <circle r="72" class="ring" stroke-opacity="0.12" stroke-width="0.5"/>
    <circle r="36" class="ring" stroke-opacity="0.15" stroke-width="0.4"/>

    <!-- Axis lines (6 axes) -->
    <!-- Blue Team (top) -->
    <line x1="0" y1="0" x2="0" y2="-180" stroke="#8B5CF6" stroke-width="0.4" opacity="0.15"/>
    <!-- Scripting (top-right) -->
    <line x1="0" y1="0" x2="155.88" y2="-90" stroke="#8B5CF6" stroke-width="0.4" opacity="0.15"/>
    <!-- Cloud (bottom-right) -->
    <line x1="0" y1="0" x2="155.88" y2="90" stroke="#8B5CF6" stroke-width="0.4" opacity="0.15"/>
    <!-- Automation (bottom) -->
    <line x1="0" y1="0" x2="0" y2="180" stroke="#8B5CF6" stroke-width="0.4" opacity="0.15"/>
    <!-- Threat Hunting (bottom-left) -->
    <line x1="0" y1="0" x2="-155.88" y2="90" stroke="#8B5CF6" stroke-width="0.4" opacity="0.15"/>
    <!-- Incident Response (top-left) -->
    <line x1="0" y1="0" x2="-155.88" y2="-90" stroke="#8B5CF6" stroke-width="0.4" opacity="0.15"/>

    <!-- Skill polygon: Blue Team 90%, Scripting 85%, Cloud 70%, Automation 95%, Threat Hunting 80%, IR 88% -->
    <!-- Values: 162, 153, 126, 171, 144, 158.4 -->
    <polygon points="0,-162 132.53,-76.5 109.12,63 0,171 -124.71,72 -137.18,-79.2"
             fill="url(#radarFill)" stroke="#8B5CF6" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1.5s" fill="freeze" begin="0.3s"/>
    </polygon>

    <!-- Animated sweep line -->
    <line x1="0" y1="0" x2="0" y2="-180" stroke="#A78BFA" stroke-width="1" opacity="0.25">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="8s" repeatCount="indefinite"/>
    </line>

    <!-- Data points with glow -->
    <!-- Blue Team -->
    <circle cx="0" cy="-162" r="4" fill="#8B5CF6" filter="url(#rGlow)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.5s"/>
    </circle>
    <!-- Scripting -->
    <circle cx="132.53" cy="-76.5" r="4" fill="#8B5CF6" filter="url(#rGlow)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.7s"/>
    </circle>
    <!-- Cloud -->
    <circle cx="109.12" cy="63" r="4" fill="#8B5CF6" filter="url(#rGlow)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.9s"/>
    </circle>
    <!-- Automation -->
    <circle cx="0" cy="171" r="4" fill="#F59E0B" filter="url(#rGlow)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1.1s"/>
    </circle>
    <!-- Threat Hunting -->
    <circle cx="-124.71" cy="72" r="4" fill="#8B5CF6" filter="url(#rGlow)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1.3s"/>
    </circle>
    <!-- Incident Response -->
    <circle cx="-137.18" cy="-79.2" r="4" fill="#8B5CF6" filter="url(#rGlow)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1.5s"/>
    </circle>

    <!-- Center dot -->
    <circle r="3" fill="#8B5CF6" opacity="0.5">
      <animate attributeName="r" values="2;4;2" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Labels (outside the radar) -->
  <text x="230" y="30" class="radar-label">BLUE TEAM</text>
  <text x="230" y="44" class="radar-score">90%</text>

  <text x="410" y="145" class="radar-label">SCRIPTING</text>
  <text x="410" y="159" class="radar-score">85%</text>

  <text x="400" y="340" class="radar-label">CLOUD SEC</text>
  <text x="400" y="354" class="radar-score">70%</text>

  <text x="230" y="440" class="radar-label">AUTOMATION</text>
  <text x="230" y="454" class="radar-score">95%</text>

  <text x="60" y="340" class="radar-label">THREAT HUNT</text>
  <text x="60" y="354" class="radar-score">80%</text>

  <text x="50" y="145" class="radar-label">INCIDENT RESP</text>
  <text x="50" y="159" class="radar-score">88%</text>
</svg>
