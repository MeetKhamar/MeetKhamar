<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="320" height="380">
  <defs>
    <!-- Gradients -->
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C2333"/>
      <stop offset="100%" stop-color="#13171F"/>
    </linearGradient>
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.12"/>
      <stop offset="40%" stop-color="white" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="45%" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.4"/>
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="neckGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C2333"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="shoulderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <radialGradient id="outerGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="purpleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerShadow">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="3" result="shadow"/>
      <feComposite in="SourceGraphic" in2="shadow" operator="over"/>
    </filter>

    <!-- Clip paths -->
    <clipPath id="visorClip">
      <path d="M100,165 Q105,140 160,130 Q215,140 220,165 L215,195 Q160,210 105,195 Z"/>
    </clipPath>
  </defs>

  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.008); }
    }
    @keyframes scanMove {
      0% { transform: translateY(-80px); }
      100% { transform: translateY(80px); }
    }
    @keyframes visorPulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
    @keyframes dotBlink {
      0%, 90%, 100% { opacity: 1; }
      95% { opacity: 0.3; }
    }
    @keyframes ringRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes dataStream {
      0% { stroke-dashoffset: 20; }
      100% { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Ambient glow background -->
  <ellipse cx="160" cy="190" rx="140" ry="170" fill="url(#outerGlow)"/>

  <!-- Main floating group -->
  <g transform="translate(0, 0)">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0.05 0.55 0.95;0.45 0.05 0.55 0.95"/>

    <!-- Breathing group -->
    <g transform-origin="160 200">
      <animateTransform attributeName="transform" type="scale" values="1;1.008;1" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0.05 0.55 0.95;0.45 0.05 0.55 0.95"/>

      <!-- Shoulders -->
      <path d="M80,310 Q80,285 110,270 L160,260 L210,270 Q240,285 240,310 L240,380 L80,380 Z" fill="url(#shoulderGrad)" stroke="#8B5CF6" stroke-width="0.5" stroke-opacity="0.2"/>
      <!-- Shoulder detail lines -->
      <line x1="110" y1="275" x2="130" y2="268" stroke="#8B5CF6" stroke-width="0.3" opacity="0.3"/>
      <line x1="210" y1="275" x2="190" y2="268" stroke="#8B5CF6" stroke-width="0.3" opacity="0.3"/>
      <!-- Collar accent -->
      <path d="M120,265 Q160,255 200,265" fill="none" stroke="#8B5CF6" stroke-width="0.8" opacity="0.4"/>

      <!-- Neck -->
      <rect x="140" y="245" width="40" height="25" rx="4" fill="url(#neckGrad)" stroke="#8B5CF6" stroke-width="0.3" stroke-opacity="0.2"/>

      <!-- Helmet body -->
      <path d="M90,170 Q90,80 160,60 Q230,80 230,170 L230,220 Q230,245 200,250 L160,255 L120,250 Q90,245 90,220 Z" fill="url(#helmetGrad)" stroke="#8B5CF6" stroke-width="0.8" stroke-opacity="0.3"/>

      <!-- Helmet panel lines -->
      <path d="M115,90 L115,240" stroke="#8B5CF6" stroke-width="0.3" opacity="0.15"/>
      <path d="M205,90 L205,240" stroke="#8B5CF6" stroke-width="0.3" opacity="0.15"/>
      <path d="M160,65 L160,130" stroke="#8B5CF6" stroke-width="0.3" opacity="0.2"/>

      <!-- Top ridge -->
      <path d="M130,68 Q160,55 190,68" fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.35"/>

      <!-- Side vents -->
      <g opacity="0.25">
        <rect x="93" y="180" width="12" height="2" rx="1" fill="#8B5CF6"/>
        <rect x="93" y="186" width="10" height="2" rx="1" fill="#8B5CF6"/>
        <rect x="93" y="192" width="8" height="2" rx="1" fill="#8B5CF6"/>
        <rect x="215" y="180" width="12" height="2" rx="1" fill="#8B5CF6"/>
        <rect x="217" y="186" width="10" height="2" rx="1" fill="#8B5CF6"/>
        <rect x="219" y="192" width="8" height="2" rx="1" fill="#8B5CF6"/>
      </g>

      <!-- Visor (main feature) -->
      <g filter="url(#purpleGlow)">
        <path d="M100,165 Q105,140 160,130 Q215,140 220,165 L215,195 Q160,210 105,195 Z" fill="url(#visorGrad)" opacity="0.85">
          <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- Visor glass reflection -->
      <path d="M108,155 Q110,145 160,136 Q190,142 200,150 L195,165 Q160,172 115,165 Z" fill="url(#glassReflect)"/>

      <!-- Scanner line (moves across visor) -->
      <g clip-path="url(#visorClip)">
        <rect x="100" y="140" width="120" height="60" fill="url(#scanLine)">
          <animateTransform attributeName="transform" type="translate" values="0,-30;0,40;0,-30" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
        </rect>
      </g>

      <!-- Visor edge highlight -->
      <path d="M100,165 Q105,140 160,130 Q215,140 220,165" fill="none" stroke="#A78BFA" stroke-width="0.8" opacity="0.6"/>
      <path d="M105,195 Q160,210 215,195" fill="none" stroke="#7C3AED" stroke-width="0.5" opacity="0.4"/>

      <!-- Eye dots in visor -->
      <g filter="url(#softGlow)">
        <circle cx="140" cy="165" r="3" fill="#F1F5F9" opacity="0.9">
          <animate attributeName="opacity" values="0.9;0.3;0.9" dur="4s" begin="0s" repeatCount="indefinite"/>
        </circle>
        <circle cx="180" cy="165" r="3" fill="#F1F5F9" opacity="0.9">
          <animate attributeName="opacity" values="0.9;0.3;0.9" dur="4s" begin="0.1s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- Chin plate -->
      <path d="M125,220 Q160,235 195,220 L190,240 Q160,250 130,240 Z" fill="#161B22" stroke="#8B5CF6" stroke-width="0.4" stroke-opacity="0.2"/>

      <!-- Mouth grille -->
      <g opacity="0.2">
        <line x1="145" y1="225" x2="175" y2="225" stroke="#8B5CF6" stroke-width="0.6"/>
        <line x1="147" y1="229" x2="173" y2="229" stroke="#8B5CF6" stroke-width="0.6"/>
        <line x1="149" y1="233" x2="171" y2="233" stroke="#8B5CF6" stroke-width="0.6"/>
      </g>

      <!-- Ear pieces -->
      <ellipse cx="88" cy="175" rx="8" ry="20" fill="#161B22" stroke="#8B5CF6" stroke-width="0.5" stroke-opacity="0.3"/>
      <ellipse cx="232" cy="175" rx="8" ry="20" fill="#161B22" stroke="#8B5CF6" stroke-width="0.5" stroke-opacity="0.3"/>
      <!-- Ear accent dots -->
      <circle cx="88" cy="170" r="2" fill="#8B5CF6" opacity="0.4">
        <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="232" cy="170" r="2" fill="#8B5CF6" opacity="0.4">
        <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite" begin="1.5s"/>
      </circle>

      <!-- Status LED on forehead -->
      <circle cx="160" cy="110" r="3" fill="#10B981" filter="url(#softGlow)">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>

      <!-- Data circuit lines on helmet surface -->
      <g stroke="#8B5CF6" stroke-width="0.4" opacity="0.12" fill="none">
        <path d="M130,80 L130,100 L140,110"/>
        <path d="M190,80 L190,100 L180,110"/>
        <path d="M120,120 L110,130 L110,150"/>
        <path d="M200,120 L210,130 L210,150"/>
      </g>

    </g>
  </g>

  <!-- Decorative orbital ring -->
  <ellipse cx="160" cy="190" rx="150" ry="20" fill="none" stroke="#8B5CF6" stroke-width="0.4" opacity="0.1" stroke-dasharray="4,8" transform="rotate(-15, 160, 190)">
    <animateTransform attributeName="transform" type="rotate" values="-15,160,190;345,160,190" dur="30s" repeatCount="indefinite"/>
  </ellipse>
</svg>
