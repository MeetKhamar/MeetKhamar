<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 420" width="340" height="420">
  <defs>
    <!-- Core Gradients -->
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="35%" stop-color="#8B5CF6"/>
      <stop offset="65%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="helmetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2536"/>
      <stop offset="60%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0F1218"/>
    </linearGradient>
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.14"/>
      <stop offset="30%" stop-color="white" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="42%" stop-color="#8B5CF6" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.3"/>
      <stop offset="58%" stop-color="#8B5CF6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="neckGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C2333"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="shoulderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181D27"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="visorEdgeTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="visorEdgeBot" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="outerGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.07"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="visorInnerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="purpleGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="microGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip paths -->
    <clipPath id="visorClip">
      <path d="M100,172 Q108,142 170,130 Q232,142 240,172 L234,204 Q170,220 106,204 Z"/>
    </clipPath>
    <clipPath id="helmetClip">
      <path d="M92,175 Q92,78 170,56 Q248,78 248,175 L248,232 Q248,258 215,264 L170,270 L125,264 Q92,258 92,232 Z"/>
    </clipPath>
  </defs>

  <!-- Ambient glow -->
  <ellipse cx="170" cy="200" rx="155" ry="190" fill="url(#outerGlow)"/>

  <!-- Outer orbital ring (slow) -->
  <ellipse cx="170" cy="205" rx="162" ry="22" fill="none" stroke="#8B5CF6" stroke-width="0.3" opacity="0.07" stroke-dasharray="3,9" transform="rotate(-12, 170, 205)">
    <animateTransform attributeName="transform" type="rotate" values="-12,170,205;348,170,205" dur="40s" repeatCount="indefinite"/>
  </ellipse>
  <!-- Inner orbital ring (counter-direction) -->
  <ellipse cx="170" cy="205" rx="135" ry="16" fill="none" stroke="#A78BFA" stroke-width="0.25" opacity="0.05" stroke-dasharray="2,12" transform="rotate(8, 170, 205)">
    <animateTransform attributeName="transform" type="rotate" values="8,170,205;-352,170,205" dur="55s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Main floating group -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0.05 0.55 0.95;0.45 0.05 0.55 0.95"/>

    <!-- Breathing group -->
    <g transform-origin="170 210">
      <animateTransform attributeName="transform" type="scale" values="1;1.006;1" dur="5.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0.05 0.55 0.95;0.45 0.05 0.55 0.95"/>

      <!-- === SHOULDERS === -->
      <path d="M82,324 Q82,296 114,280 L170,268 L226,280 Q258,296 258,324 L258,420 L82,420 Z" fill="url(#shoulderGrad)" stroke="#8B5CF6" stroke-width="0.4" stroke-opacity="0.15"/>
      <!-- Shoulder seams -->
      <path d="M114,284 L138,274" stroke="#8B5CF6" stroke-width="0.25" opacity="0.2"/>
      <path d="M226,284 L202,274" stroke="#8B5CF6" stroke-width="0.25" opacity="0.2"/>
      <!-- Collar -->
      <path d="M126,274 Q170,262 214,274" fill="none" stroke="#8B5CF6" stroke-width="0.6" opacity="0.25"/>
      <!-- Shoulder insignia dots -->
      <circle cx="108" cy="300" r="1.2" fill="#8B5CF6" opacity="0.2"/>
      <circle cx="108" cy="306" r="1.2" fill="#8B5CF6" opacity="0.15"/>
      <circle cx="232" cy="300" r="1.2" fill="#8B5CF6" opacity="0.2"/>
      <circle cx="232" cy="306" r="1.2" fill="#8B5CF6" opacity="0.15"/>

      <!-- === NECK === -->
      <rect x="150" y="256" width="40" height="22" rx="5" fill="url(#neckGrad)" stroke="#8B5CF6" stroke-width="0.25" stroke-opacity="0.15"/>

      <!-- === HELMET BODY === -->
      <path d="M92,175 Q92,78 170,56 Q248,78 248,175 L248,232 Q248,258 215,264 L170,270 L125,264 Q92,258 92,232 Z" fill="url(#helmetGrad)" stroke="#8B5CF6" stroke-width="0.7" stroke-opacity="0.2"/>

      <!-- Helmet surface detail -->
      <g clip-path="url(#helmetClip)" opacity="0.08" stroke="#8B5CF6" stroke-width="0.3" fill="none">
        <!-- Vertical panel lines -->
        <path d="M118,82 L118,252"/>
        <path d="M222,82 L222,252"/>
        <path d="M170,60 L170,130"/>
        <!-- Horizontal bands -->
        <path d="M100,120 Q170,112 240,120"/>
        <path d="M96,210 Q170,218 244,210"/>
        <!-- Circuit traces -->
        <path d="M135,78 L135,105 L145,115"/>
        <path d="M205,78 L205,105 L195,115"/>
        <path d="M108,135 L108,160"/>
        <path d="M232,135 L232,160"/>
        <!-- Micro details -->
        <path d="M125,85 L128,88"/>
        <path d="M215,85 L212,88"/>
      </g>

      <!-- Top ridge crest -->
      <path d="M138,64 Q170,50 202,64" fill="none" stroke="#8B5CF6" stroke-width="0.8" opacity="0.25"/>
      <path d="M148,60 Q170,52 192,60" fill="none" stroke="#A78BFA" stroke-width="0.4" opacity="0.15"/>

      <!-- === VISOR === -->
      <g filter="url(#purpleGlow)">
        <path d="M100,172 Q108,142 170,130 Q232,142 240,172 L234,204 Q170,220 106,204 Z" fill="url(#visorGrad)" opacity="0.82">
          <animate attributeName="opacity" values="0.82;0.95;0.82" dur="4.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
        </path>
      </g>

      <!-- Visor inner glow layer -->
      <path d="M100,172 Q108,142 170,130 Q232,142 240,172 L234,204 Q170,220 106,204 Z" fill="url(#visorInnerGlow)"/>

      <!-- Visor glass reflection -->
      <path d="M110,162 Q115,148 170,138 Q205,144 218,155 L212,175 Q170,182 118,175 Z" fill="url(#glassReflect)"/>

      <!-- Scanner sweep -->
      <g clip-path="url(#visorClip)">
        <rect x="98" y="125" width="144" height="100" fill="url(#scanLine)">
          <animateTransform attributeName="transform" type="translate" values="0,-35;0,45;0,-35" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0.35 0 0.65 1;0.35 0 0.65 1"/>
        </rect>
      </g>

      <!-- Visor edge highlights -->
      <path d="M100,172 Q108,142 170,130 Q232,142 240,172" fill="none" stroke="url(#visorEdgeTop)" stroke-width="1"/>
      <path d="M106,204 Q170,220 234,204" fill="none" stroke="url(#visorEdgeBot)" stroke-width="0.7"/>

      <!-- Eye indicators -->
      <g filter="url(#softGlow)">
        <circle cx="148" cy="172" r="3.5" fill="#F1F5F9" opacity="0.85">
          <animate attributeName="opacity" values="0.85;0.25;0.85" dur="4.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 0.5 1;0.5 0 0.5 1"/>
        </circle>
        <circle cx="192" cy="172" r="3.5" fill="#F1F5F9" opacity="0.85">
          <animate attributeName="opacity" values="0.85;0.25;0.85" dur="4.2s" begin="0.15s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 0.5 1;0.5 0 0.5 1"/>
        </circle>
        <!-- Pupil reflections -->
        <circle cx="149.5" cy="170.5" r="1" fill="white" opacity="0.3"/>
        <circle cx="193.5" cy="170.5" r="1" fill="white" opacity="0.3"/>
      </g>

      <!-- === CHIN ASSEMBLY === -->
      <path d="M130,228 Q170,246 210,228 L205,252 Q170,262 135,252 Z" fill="#141920" stroke="#8B5CF6" stroke-width="0.35" stroke-opacity="0.15"/>
      <!-- Grille lines -->
      <g opacity="0.14" stroke="#8B5CF6" stroke-width="0.5">
        <line x1="150" y1="235" x2="190" y2="235"/>
        <line x1="152" y1="240" x2="188" y2="240"/>
        <line x1="155" y1="245" x2="185" y2="245"/>
      </g>

      <!-- === EAR MODULES === -->
      <g>
        <!-- Left -->
        <ellipse cx="89" cy="182" rx="9" ry="22" fill="#141920" stroke="#8B5CF6" stroke-width="0.4" stroke-opacity="0.2"/>
        <circle cx="89" cy="176" r="2.2" fill="#8B5CF6" opacity="0.3" filter="url(#microGlow)">
          <animate attributeName="opacity" values="0.15;0.45;0.15" dur="3.2s" repeatCount="indefinite"/>
        </circle>
        <rect x="84" y="185" width="10" height="1" rx="0.5" fill="#8B5CF6" opacity="0.1"/>
        <rect x="85" y="189" width="8" height="1" rx="0.5" fill="#8B5CF6" opacity="0.08"/>
        <!-- Right -->
        <ellipse cx="251" cy="182" rx="9" ry="22" fill="#141920" stroke="#8B5CF6" stroke-width="0.4" stroke-opacity="0.2"/>
        <circle cx="251" cy="176" r="2.2" fill="#8B5CF6" opacity="0.3" filter="url(#microGlow)">
          <animate attributeName="opacity" values="0.15;0.45;0.15" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
        </circle>
        <rect x="246" y="185" width="10" height="1" rx="0.5" fill="#8B5CF6" opacity="0.1"/>
        <rect x="247" y="189" width="8" height="1" rx="0.5" fill="#8B5CF6" opacity="0.08"/>
      </g>

      <!-- === SIDE VENTS === -->
      <g opacity="0.18">
        <rect x="94" y="188" width="10" height="1.5" rx="0.75" fill="#8B5CF6"/>
        <rect x="95" y="193" width="8" height="1.5" rx="0.75" fill="#8B5CF6"/>
        <rect x="96" y="198" width="6" height="1.5" rx="0.75" fill="#8B5CF6"/>
        <rect x="236" y="188" width="10" height="1.5" rx="0.75" fill="#8B5CF6"/>
        <rect x="237" y="193" width="8" height="1.5" rx="0.75" fill="#8B5CF6"/>
        <rect x="238" y="198" width="6" height="1.5" rx="0.75" fill="#8B5CF6"/>
      </g>

      <!-- === FOREHEAD STATUS LED === -->
      <circle cx="170" cy="108" r="2.5" fill="#10B981" filter="url(#softGlow)">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      </circle>
      <!-- LED bracket -->
      <path d="M164,108 L170,104 L176,108" fill="none" stroke="#10B981" stroke-width="0.4" opacity="0.2"/>

    </g>
  </g>
</svg>
